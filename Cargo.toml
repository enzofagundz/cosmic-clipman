[package]
name = "cosmic-clipman"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
description = "Clipboard history for the COSMIC desktop"
repository = "https://github.com/enzofagundz/cosmic-clipman"
rust-version = "1.93"

[lib]
name = "cosmic_clipman"
path = "src/lib.rs"

[[bin]]
name = "cosmic-clipman"
path = "src/main.rs"

[build-dependencies]
xdgen = "0.1"

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
futures = "0.3.34"
i18n-embed-fl = "0.10"
regex = "1.13.1"
ron = "0.12.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = "8.11"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.52.0", features = ["full"] }
wayland-client = "0.31.15"
wayland-protocols-misc = "0.3.12"
wl-clipboard-rs = "0.9.4"
xkbcommon = "0.9.0"
zbus = { version = "6.0.0", features = ["tokio"] }

[dependencies.i18n-embed]
version = "0.16"
features = ["fluent-system", "desktop-requester"]

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
# See https://github.com/pop-os/libcosmic/blob/master/Cargo.toml for available features.
features = [
    # Applet support
    "applet",
    "applet-token",
    # Uses tokio as the executor for the runtime
    "tokio",
    # Add Wayland support to winit
    "wayland",
    # Windowing support for X11, Windows, Mac, & Redox
    "winit",
]

[dev-dependencies]
serde_json = "1.0.154"
